server {
    listen 80;
    server_name crea.futurvps.pro;

    # Si vous utilisez SSL avec Certbot, commentez le bloc listen 80 et utilisez listen 443 ssl

    # 1. API et Uploads (Node.js Backend)
    # Toutes les requêtes commençant par /api ou /uploads vont au serveur Node (Port 4523)
    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:4523;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Autoriser de plus gros fichiers pour l'upload d'images
        client_max_body_size 50M;
    }

    # 2. Frontend (Vite Build Static)
    # Le reste du trafic sert les fichiers statiques de l'application React
    location / {
        root /root/crea_ads/app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
